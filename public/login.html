<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('/WhatsApp%20Image%202026-11-12%20at%204.03.54%20PM.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .card {
    position: relative;
    z-index: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .card h1 { font-size: 1.5rem; margin-bottom: 8px; color: #e6edf3; }
  .card p { font-size: 0.9rem; color: #8b949e; margin-bottom: 24px; }
  .card .icon { font-size: 3rem; margin-bottom: 16px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    font-size: 1rem;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="password"]:focus { border-color: #58a6ff; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2ea043; }
  .error {
    background: #f8514922;
    border: 1px solid #f85149;
    color: #f85149;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🤖</div>
    <h1>Scoreboard Control</h1>
    <p>Enter the admin password to access the control panel.</p>
    <div class="error" id="error" style="display:none">Incorrect password. Try again.</div>
    <form method="POST" action="/login">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit">Sign In</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1')) document.getElementById('error').style.display = 'block';
  </script>
</body>
</html>
